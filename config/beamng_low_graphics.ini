# Project Hamilton BeamNG low-graphics preset
#
# Edit values in the [settings] section to tune startup graphics without
# touching Python code. The bootstrap applies this file only when launched with
# --low-graphics, and only for the Student-machine BeamNG install.
#
# Values are parsed as:
#   true/false -> booleans
#   123        -> integer
#   1.25       -> float
#   "text"     -> string, useful when a value looks numeric but should stay text
#
# These settings are ranked roughly by expected GPU/VRAM/RAM impact for our
# BeamNG RL bootstrap. The exact gain depends on the map, vehicle, camera, and
# whether traffic or extra sensors are running.

[settings]

# 1. Render fewer pixels and cap frame rate.
#    Biggest direct GPU win. Lower resolution also reduces render-target memory.
#    GraphicDisplayModes range: Window, Borderless, Fullscreen.
#    GraphicDisplayResolutions range: "800 600", "1024 768", "1280 720",
#    "1920 1080", or another supported resolution string.
#    fpsLimit practical range: 15-60 for training; lower reduces GPU work but
#    may make visual inspection less smooth.
GraphicDisplayModes = Window
GraphicDisplayResolutions = "800 600"
fpsLimitEnabled = true
fpsLimit = 30
vsync = false
GraphicTripleMonitorEnabled = false

# 2. Apply BeamNG's own broad lowest graphics preset first.
#    Range: Custom, Lowest, Low, SteamDeck, Normal, High, Ultra.
#    The individual settings below then make the important values explicit and
#    easy to override without needing to remember what the preset contains.
GraphicOverallQuality = Lowest

# 3. Texture quality: large VRAM/RAM impact.
#    Range: Lowest, Low, Normal, High.
#    Lowest maps to textureReductionLevel = 2 in BeamNG's local Lua settings.
GraphicTextureQuality = Lowest

# 4. Shadows: proven through the smoke test.
#    GraphicShadowsQuality range: Lowest, Low, Normal, High.
#    GraphicDisableShadows range: "0" = all shadows, "1" = partial disable,
#    "2" = disable all shadows.
GraphicShadowsQuality = Lowest
GraphicDisableShadows = "2"

# 5. Dynamic vehicle reflections and mirrors: expensive render targets.
#    Enabled range: true/false, though BeamNG's mirror preset uses 0/1.
#    Texsize range: 0-3, representing 128, 256, 512, 1024 px.
#    Detail range: 0.0-1.0. Distance is metres.
GraphicDynReflectionEnabled = false
GraphicDynReflectionFacesPerupdate = 1
GraphicDynReflectionDetail = 0
GraphicDynReflectionDistance = 10
GraphicDynReflectionTexsize = 0
GraphicDynMirrorsEnabled = 0
GraphicDynMirrorsDetail = 0
GraphicDynMirrorsDistance = 10
GraphicDynMirrorsTexsize = 0

# 6. Post-processing: reduces screen-space passes and render targets.
#    SSAO quality range: Normal, High. It is irrelevant when SSAO is disabled,
#    but keeping it low avoids surprises if SSAO is re-enabled later.
PostFXSSAOGeneralEnabled = false
PostFXSSAOGeneralQuality = Normal
PostFXLightRaysEnabled = false
PostFXBloomGeneralEnabled = false
PostFXDOFGeneralEnabled = false
PostFXMotionBlurEnabled = false
PostFXMotionBlurStrength = 0
PostFXMotionBlurPlayerVehicle = false

# 7. Mesh, terrain, grass, and decals: reduces geometry/detail/object pressure.
#    GraphicMeshQuality range: Lowest, Low, Normal, High, Ultra.
#    GraphicGrassDensity range: 0.0-1.0.
#    GraphicMaxDecalCount range: 0+; BeamNG defaults are around 4000.
GraphicMeshQuality = Lowest
GraphicGrassDensity = 0
GraphicMaxDecalCount = 0

# 8. Lighting and shader complexity.
#    GraphicLightingQuality range: Lowest, Low, High, Ultra.
#    GraphicShaderQuality range: Low, High.
GraphicLightingQuality = Lowest
GraphicShaderQuality = Low

# 9. Filtering and anti-aliasing.
#    GraphicAnisotropic range: 0, 4, 8, 16.
#    GraphicAntialias range: 0, 1, 2, 4.
#    GraphicAntialiasType range: fxaa, smaa. Type is mostly irrelevant when
#    GraphicAntialias is 0, but fxaa is the cheaper option if re-enabled.
GraphicAnisotropic = 0
GraphicAntialias = 0
GraphicAntialiasType = fxaa

# 10. Small extras and object-count pressure.
#     These do not replace scenario design, but they help keep incidental load
#     down if the simulator defaults are used.
SkipGenerateLicencePlate = true
trafficAmount = 0
trafficExtraAmount = 0
trafficExtraVehicles = false
trafficParkedAmount = 0
trafficParkedVehicles = false

# Optional, not enabled by default because it can change simulation/contact
# behaviour and may invalidate RL training assumptions:
# disableDynamicCollision = true
